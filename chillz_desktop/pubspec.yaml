name: Chillz_desktop
description: A minimal Flutter Windows desktop IPTV player using libVLC
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^0.13.6
  path_provider: ^2.0.13
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1   # ← ADD THIS

flutter:
  uses-material-design: true
  assets:
    - assets/images/


flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"

  android: true
  ios: true

  windows:
    generate: true
    icon_size: 256

  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true
