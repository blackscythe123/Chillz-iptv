name: chillz_app
description: A cross-platform IPTV player using libVLC (Windows) and media_kit (Android)
publish_to: 'none'
version: 0.1.0
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Direct libVLC integration via platform channels - Windows
  provider: ^6.1.5+1
  http: ^0.13.6
  path_provider: ^2.0.13
  json_annotation: ^4.8.0
  
  # Android video playback - media_kit (MPV backend)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  
  # Keep Windows libs for potential future use
  # media_kit_libs_windows_video: ^1.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

